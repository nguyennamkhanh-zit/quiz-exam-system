services:
  # 1. Ứng dụng Quiz Core App (Node.js)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: quiz-exam-app:1.0.0
    restart: unless-stopped
    environment:
      - PORT=18095
      - NODE_ENV=production
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_USER=${DB_USER:?Vui lòng cấu hình DB_USER trong .env}
      - DB_PASSWORD=${DB_PASSWORD:?Vui lòng cấu hình DB_PASSWORD trong .env}
      - DB_NAME=${DB_NAME:?Vui lòng cấu hình DB_NAME trong .env}
      - JWT_SECRET=${JWT_SECRET:?Vui lòng cấu hình JWT_SECRET trong .env}
      - LOG_DIR=/var/log/app
      - PUBLIC_BASE_URL=${PUBLIC_BASE_URL:-http://localhost:18098}
      - SMTP_HOST=${SMTP_HOST:-smtp.gmail.com}
      - SMTP_PORT=${SMTP_PORT:-465}
      - SMTP_SECURE=${SMTP_SECURE:-true}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - SMTP_FROM=${SMTP_FROM:-}
    volumes:
      - app_logs:/var/log/app
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - quiz_internal
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:18095/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1))"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # 2. Cơ sở dữ liệu MySQL 8.4 LTS
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:?Vui lòng cấu hình MYSQL_ROOT_PASSWORD trong .env}
      - MYSQL_DATABASE=${DB_NAME:?Vui lòng cấu hình DB_NAME trong .env}
      - MYSQL_USER=${DB_USER:?Vui lòng cấu hình DB_USER trong .env}
      - MYSQL_PASSWORD=${DB_PASSWORD:?Vui lòng cấu hình DB_PASSWORD trong .env}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./db/seed.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro
      - ./db/mysql_init_exporter.sql:/docker-entrypoint-initdb.d/03_exporter.sql:ro
    networks:
      - quiz_internal
    ports:
      - "127.0.0.1:13325:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:?Vui lòng cấu hình MYSQL_ROOT_PASSWORD trong .env}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # 3. phpMyAdmin - Quản trị DB giao diện Web
  phpmyadmin:
    image: phpmyadmin:5.2.3-apache
    restart: unless-stopped
    environment:
      - PMA_HOST=mysql
      - PMA_PORT=3306
      - UPLOAD_LIMIT=10M
    networks:
      - quiz_internal
    ports:
      - "127.0.0.1:18096:80"
    depends_on:
      mysql:
        condition: service_healthy

  # 4. Reverse Proxy Nginx
  nginx:
    image: nginx:stable-alpine
    restart: unless-stopped
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - nginx_logs:/var/log/nginx
    ports:
      - "18098:80"
    networks:
      - quiz_internal
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 15s
      timeout: 5s
      retries: 3

  # 5. Nginx Prometheus Exporter
  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.5.1
    restart: unless-stopped
    command:
      - --nginx.scrape-uri=http://nginx:8080/stub_status
    networks:
      - quiz_internal
    depends_on:
      - nginx

  # 6. MySQL Prometheus Exporter
  mysql-exporter:
    image: prom/mysqld-exporter:v0.20.0
    restart: unless-stopped
    volumes:
      - ./monitoring/my.cnf:/.my.cnf:ro
    networks:
      - quiz_internal
    depends_on:
      mysql:
        condition: service_healthy

  # 7. cAdvisor - Giám sát CPU/RAM Container thực tế
  cadvisor:
    image: ghcr.io/google/cadvisor:0.60.6
    restart: unless-stopped
    privileged: true
    devices:
      - /dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    networks:
      - quiz_internal
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 20s
      timeout: 5s
      retries: 3

  # 8. Prometheus Server
  prometheus:
    image: prom/prometheus:v3.15.0
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --web.console.libraries=/usr/share/prometheus/console_libraries
      - --web.console.templates=/usr/share/prometheus/consoles
    networks:
      - quiz_internal
    ports:
      - "127.0.0.1:19095:9090"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9090/-/ready"]
      interval: 15s
      timeout: 5s
      retries: 3

  # 9. Grafana Dashboard
  grafana:
    image: grafana/grafana:13.2.3
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - quiz_internal
    ports:
      - "127.0.0.1:18097:3000"
    depends_on:
      - prometheus
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  # 10. Loki - Centralized Logging Server
  loki:
    image: grafana/loki:3.6.17
    restart: unless-stopped
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./logging/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    networks:
      - quiz_internal
    ports:
      - "127.0.0.1:13105:3100"

  # 11. Promtail - Log Collection Agent
  promtail:
    image: grafana/promtail:3.5.11
    restart: unless-stopped
    command: -config.file=/etc/promtail/config.yml
    volumes:
      - ./logging/promtail-config.yml:/etc/promtail/config.yml:ro
      - nginx_logs:/var/log/nginx:ro
      - app_logs:/var/log/app:ro
    networks:
      - quiz_internal
    depends_on:
      - loki

networks:
  quiz_internal:
    driver: bridge

volumes:
  mysql_data:
  prometheus_data:
  grafana_data:
  loki_data:
  nginx_logs:
  app_logs:
