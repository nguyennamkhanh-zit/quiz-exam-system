services:
  # 1. Ứng dụng Quiz Core App (Node.js)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: quiz-exam-app:1.0.0
    restart: unless-stopped
    environment:
      - PORT=18095
      - NODE_ENV=production
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_USER=${DB_USER:?Vui lòng cấu hình DB_USER trong .env}
      - DB_PASSWORD=${DB_PASSWORD:?Vui lòng cấu hình DB_PASSWORD trong .env}
      - DB_NAME=${DB_NAME:?Vui lòng cấu hình DB_NAME trong .env}
      - JWT_SECRET=${JWT_SECRET:?Vui lòng cấu hình JWT_SECRET trong .env}
      - LOG_DIR=/var/log/app
      - PUBLIC_BASE_URL=${PUBLIC_BASE_URL:-http://localhost:18098}
      - SMTP_HOST=${SMTP_HOST:-smtp.gmail.com}
      - SMTP_PORT=${SMTP_PORT:-465}
      - SMTP_SECURE=${SMTP_SECURE:-true}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - SMTP_FROM=${SMTP_FROM:-}
    volumes:
      - app_logs:/var/log/app
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - quiz_internal
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:18095/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1))"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # 2. Cơ sở dữ liệu MySQL 8.4 LTS
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:?Vui lòng cấu hình MYSQL_ROOT_PASSWORD trong .env}
      - MYSQL_DATABASE=${DB_NAME:?Vui lòng cấu hình DB_NAME trong .env}
      - MYSQL_USER=${DB_USER:?Vui lòng cấu hình DB_USER trong .env}
      - MYSQL_PASSWORD=${DB_PASSWORD:?Vui lòng cấu hình DB_PASSWORD trong .env}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./db/seed.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro
      - ./db/mysql_init_exporter.sql:/docker-entrypoint-initdb.d/03_exporter.sql:ro
    networks:
      - quiz_internal
    ports:
      - "127.0.0.1:13325:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:?Vui lòng cấu hình MYSQL_ROOT_PASSWORD trong .env}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # 3. phpMyAdmin - Quản trị DB giao diện Web
  phpmyadmin:
    image: phpmyadmin:5.2.3-apache
    restart: unless-stopped
    environment:
      - PMA_HOST=mysql
      - PMA_PORT=3306
      - UPLOAD_LIMIT=10M
    networks:
      - quiz_internal
    ports:
      - "127.0.0.1:18096:80"
    depends_on:
      mysql:
        condition: service_healthy

  # 4. Reverse Proxy Nginx
  nginx:
    image: nginx:stable-alpine
    restart: unless-stopped
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - nginx_logs:/var/log/nginx
    ports:
      - "18098:80"
    networks:
      - quiz_internal
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 15s
      timeout: 5s
      retries: 3

networks:
  quiz_internal:
    driver: bridge

volumes:
  mysql_data:
  nginx_logs:
  app_logs:
