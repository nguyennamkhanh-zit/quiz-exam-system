user nginx;
worker_processes auto;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Ẩn số hiệu phiên bản Nginx
    server_tokens off;

    # Định dạng Log JSON cho Promtail/Loki
    log_format json_analytics escape=json '{'
        '"time_local":"$time_iso8601",'
        '"remote_addr":"$remote_addr",'
        '"request_method":"$request_method",'
        '"request_uri":"$request_uri",'
        '"status":$status,'
        '"body_bytes_sent":$body_bytes_sent,'
        '"request_time":$request_time,'
        '"http_referrer":"$http_referer",'
        '"http_user_agent":"$http_user_agent"'
    '}';

    access_log /var/log/nginx/access.log json_analytics;
    error_log /var/log/nginx/error.log warn;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Giới hạn kích thước request body
    client_max_body_size 2M;

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=one:10m rate=30r/s;

    # Upstream tới Node.js Core Backend
    upstream quiz_backend {
        server app:18095;
        keepalive 32;
    }

    server {
        listen 80;
        server_name localhost 127.0.0.1;

        # Hardening Security Headers
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self'; frame-ancestors 'none';" always;

        # Chỉ cho phép Nginx Exporter nội bộ docker lấy status
        # Client bên ngoài gửi host header hoặc IP docker gateway sẽ bị chặn 403
        location = /stub_status {
            stub_status;
            # Chỉ cho phép kết nối nội bộ từ localhost container nginx
            allow 127.0.0.1;
            allow ::1;
            deny all;
        }

        # Chặn toàn bộ truy cập từ bên ngoài vào metrics
        location = /metrics {
            allow 127.0.0.1;
            allow ::1;
            deny all;
            proxy_pass http://quiz_backend;
        }

        location / {
            limit_req zone=one burst=50 nodelay;

            proxy_pass http://quiz_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;

            proxy_connect_timeout 10s;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
        }
    }

    # Internal server block chỉ dành cho Exporters / Prometheus nội bộ (port 8080)
    server {
        listen 8080;
        server_name _;

        location /stub_status {
            stub_status;
            allow all;
        }

        location /metrics {
            proxy_pass http://quiz_backend;
        }
    }
}
